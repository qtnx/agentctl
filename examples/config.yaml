base_dir: ~/agent-workspaces
state_dir: ~/.local/state/agentctl
gitlab:
  host: gitlab.example.com
repos:
  backend:
    path: ~/code/example-group/backend
    project_id: "12345678"
    default_branch: main
    remote: git@gitlab.example.com:example-group/backend.git
remotes:
  buildbox-1:
    host: buildbox-1.example.com
    user: agent
    agentctl_path: /usr/local/bin/agentctl
    config_path: /etc/agentctl/config.yaml
templates:
  default: node
sandbox:
  macos:
    mode: strict
    network: true
    allow_read:
      - /bin
      - /sbin
      - /usr
      - /System
      - /Library
      - /opt/homebrew
      - /usr/local
      - /private/var/select
      - /var/select
      - /var/db/xcode_select_link
      - /private/var/db/xcode_select_link
      - /etc/codex
      - /private/etc/codex
    allow_write:
      - workspace
      - task_home
      - state_dir
      - tmp
    deny_read:
      - ~/.ssh
      - ~/.aws
      - ~/.config
      - ~/.gitconfig
      - ~/Desktop
      - ~/Documents
    allow_tools:
      - git
      - ssh
      - make
      - cmake
      - clang
      - clang++
      - gcc
      - g++
      - python
      - python3
      - pip
      - pip3
      - uv
      - poetry
      - node
      - npm
      - npx
      - pnpm
      - yarn
      - bun
      - deno
      - go
      - rustup
      - cargo
      - rustc
      - java
      - javac
      - mvn
      - gradle
      - jq
      - rg
      - zsh
      - codex
      - claude
      - ompx
      - agentctl
    env:
      GOPATH: ${TASK_HOME}/go
      GOCACHE: ${TASK_HOME}/.cache/go-build
      GOMODCACHE: ${TASK_HOME}/go/pkg/mod
      npm_config_cache: ${TASK_HOME}/.npm
      PNPM_HOME: ${TASK_HOME}/.pnpm
      CARGO_HOME: ${TASK_HOME}/.cargo
      RUSTUP_HOME: ${TASK_HOME}/.rustup
    custom_rules:
      allow_read: []
      allow_write: []
